{% extends "base.html" %}
{% block content %}

<div style="max-width: 500px; margin: auto; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); background: #fff;">

    <h2 style="text-align: center; color: #333;">📤 Upload Students</h2>
    <!--  Messages show -->
    {% if messages %}
        {% for message in messages %}
            <div style="padding:10px; margin-bottom:10px; border-radius:5px;
                        background-color: {% if message.tags == 'error' %}#ffcccc{% else %}#ccffcc{% endif %};
                        color:#333;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label><b>Select CSV / Excel File:</b></label><br><br>

        <input type="file" name="file" required
               style="padding:8px; width:100%; border:1px solid #ccc; border-radius:5px;"><br><br>

        <button type="submit"
                style="width:100%; padding:10px; background:#4CAF50; color:white;
                       border:none; border-radius:5px; font-size:16px; cursor:pointer;">
            Upload File
        </button>
    </form>

    <br>

    <a href="{% url 'dashboard' %}"
       style="display:block; text-align:center; color:#555;">
       ⬅ Back to Dashboard
    </a>

</div>

{% endblock %}
